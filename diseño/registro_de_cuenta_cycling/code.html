e; }</style></head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="Volver" class="w-11 h-11 -ml-space-xs rounded-full flex items-center justify-center text-on-surface hover:bg-surface-container active:scale-95 transition-all" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><div class="flex items-center gap-space-xs"><div class="w-7 h-7 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container"><span class="material-symbols-outlined text-[16px]">pedal_bike</span></div><span class="font-label-lg text-label-lg tracking-tight uppercase text-on-surface">CYCLING</span></div></div><div class="flex items-center gap-space-sm"><span class="hidden sm:inline-block font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Registro</span><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full px-margin pt-16 pb-safe bg-surface"><div class="flex flex-col w-full pb-safe">
<!-- Encabezado de alta energía -->
<div class="flex flex-col pt-space-md pb-space-sm">

<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight">
      Crea tu cuenta
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1.5 leading-relaxed">Empieza a rodar por las mejores ciclovías.</p>
</div>
<!-- Tarjeta de inspiración fotográfica de comunidad -->

<!-- Formulario de Registro -->
<form class="flex flex-col gap-space-md mt-space-xs" id="register-form" onsubmit="event.preventDefault();">
<!-- Campo: Nombre Completo -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="full-name">Nombre y apellido</label>
<div class="relative flex items-center bg-surface-container-lowest rounded-xl shadow-sm focus-within:shadow-md transition-all">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px]">person</span>
<input class="w-full h-[52px] pl-11 pr-4 bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none rounded-xl" id="full-name" placeholder="Ej. Camila Valdivia" type="text">
</div>
</div>
<!-- Campo: Correo Electrónico -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="email">Correo electrónico</label>
<div class="relative flex items-center bg-surface-container-lowest rounded-xl shadow-sm focus-within:shadow-md transition-all">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px]">alternate_email</span>
<input class="w-full h-[52px] pl-11 pr-4 bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none rounded-xl" id="email" placeholder="ciclista@ejemplo.com" type="email">
</div>
</div>
<!-- Campo: Contraseña con Toggle Visibilidad -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="password">Contraseña</label>
<div class="relative flex items-center bg-surface-container-lowest rounded-xl shadow-sm focus-within:shadow-md transition-all">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px]">lock</span>
<input class="w-full h-[52px] pl-11 pr-12 bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none rounded-xl tracking-normal" id="password" placeholder="Mínimo 8 caracteres" type="password" value="VeloCity2024!">
<button aria-label="Alternar visibilidad de contraseña" class="absolute right-2 w-9 h-9 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container active:scale-95 transition-all" id="toggle-password-btn" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwd-icon">visibility</span>
</button>
</div>
<!-- Indicador visual de fortaleza de contraseña -->

</div>
<!-- Selector de Tipo de Ciclismo Principal -->

<!-- Checkbox de aceptación de términos -->
<div class="flex items-start gap-3 pt-1">
<div class="relative flex items-center justify-center pt-0.5">
<input checked="" class="peer appearance-none w-[22px] h-[22px] rounded-lg bg-surface-container-highest checked:bg-inverse-surface transition-all cursor-pointer shadow-sm" id="terms" type="checkbox">
<span class="material-symbols-outlined absolute pointer-events-none text-primary-container text-[16px] opacity-0 peer-checked:opacity-100 font-bold transition-opacity">
          check
        </span>
</div>
<label class="font-body-sm text-body-sm text-on-surface-variant leading-snug cursor-pointer select-none" for="terms">
        Acepto los <a class="text-on-surface font-semibold underline decoration-primary/40 underline-offset-2" href="#">Términos de Servicio</a> y la <a class="text-on-surface font-semibold underline decoration-primary/40 underline-offset-2" href="#">Política de Privacidad</a> de CYCLING.
      </label>
</div>
<!-- Botón Primario Prominente -->
<div class="pt-2">
<button class="w-full h-14 rounded-full bg-primary-container text-on-primary-fixed shadow-md active:bg-inverse-primary hover:shadow-lg active:scale-[0.99] transition-all flex items-center justify-center gap-2" type="submit"><span class="font-label-lg text-label-lg tracking-wide">Crear cuenta</span></button>
</div>
</form>
<!-- Separador de alternativas sociales -->
<div class="relative flex items-center justify-center my-space-lg">
<div class="absolute inset-x-0 h-[1px] bg-outline-variant/60"></div>
<span class="relative px-3 bg-surface font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">
      O regístrate con
    </span>
</div>
<!-- Botones de Vinculación / SSO -->
<div class="grid grid-cols-3 gap-space-sm"><button aria-label="Strava" class="h-12 rounded-xl bg-surface-container-lowest text-on-surface shadow-sm active:bg-surface-container-high transition-all flex items-center justify-center gap-2" type="button"><div class="w-6 h-6 rounded-full bg-tertiary-container text-on-tertiary-container flex items-center justify-center"><span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">sync</span></div><span class="font-label-md text-label-md font-semibold">Strava</span></button><button aria-label="Google" class="h-12 rounded-xl bg-surface-container-lowest text-on-surface shadow-sm active:bg-surface-container-high transition-all flex items-center justify-center gap-2" type="button"><svg class="w-4 h-4" viewBox="0 0 24 24"><path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z" fill="#4285F4"></path><path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z" fill="#34A853"></path><path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path><path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path></svg><span class="font-label-md text-label-md font-semibold">Google</span></button><button aria-label="Apple" class="h-12 rounded-xl bg-surface-container-lowest text-on-surface shadow-sm active:bg-surface-container-high transition-all flex items-center justify-center gap-2" type="button"><span class="material-symbols-outlined text-[20px]">ios</span><span class="font-label-md text-label-md font-semibold">Apple</span></button></div>
<!-- Pie de Pantalla / Enlace a Login -->
<div class="mt-space-lg mb-space-md flex items-center justify-center gap-1.5 text-center">
<span class="font-body-md text-body-md text-on-surface-variant">¿Ya eres miembro?</span>
<button class="font-label-md text-label-md text-primary font-bold hover:underline active:opacity-80" type="button">
      Iniciar sesión
    </button>
</div>
</div>
<script>
  // Micro-interacción: alternar visibilidad de contraseña
  const toggleBtn = document.getElementById('toggle-password-btn');
  const pwdInput = document.getElementById('password');
  const pwdIcon = document.getElementById('pwd-icon');

  if (toggleBtn && pwdInput && pwdIcon) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = pwdInput.type === 'password';
      pwdInput.type = isPassword ? 'text' : 'password';
      pwdIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });
  }

  // Micro-interacción: selección de chips de tipo de ciclismo
  const chips = document.querySelectorAll('.bike-chip');
  chips.forEach(chip => {
    chip.addEventListener('click', () => {
      chips.forEach(c => {
        c.classList.remove('bg-primary-container', 'text-on-primary-fixed');
        c.classList.add('bg-surface-container-lowest', 'text-on-surface-variant');
      });
      chip.classList.remove('bg-surface-container-lowest', 'text-on-surface-variant');
      chip.classList.add('bg-primary-container', 'text-on-primary-fixed');
    });
  });
</script></main>

</body></html>
