        tiltBtn.textContent = is3D ? '2D' : '3D';
        tiltBtn.classList.toggle('bg-primary-container');
        tiltBtn.classList.toggle('text-on-primary-container');
      });
    }

    if (layerBtn) {
      layerBtn.addEventListener('click', () => {
        layerBtn.classList.toggle('opacity-70');
      });
    }

    if (destinationPin) {
      destinationPin.addEventListener('click', () => {
        destinationPin.classList.toggle('scale-125');
        setTimeout(() => destinationPin.classList.remove('scale-125'), 300);
      });
    }
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface-container-lowest/95 backdrop-blur-xl shadow-[0_-2px_12px_rgba(0,0,0,0.05)]" data-active-classes="text-on-surface font-bold"><div class="h-16 px-gutter-mobile flex items-center justify-around"><a class="flex flex-col items-center justify-center min-w-[56px] h-12 text-secondary hover:text-on-surface transition-colors" data-path="inicio" href="#"><span class="material-symbols-outlined text-[24px]">home</span><span class="font-label-sm text-label-sm mt-0.5">Inicio</span></a><a aria-current="page" class="flex flex-col items-center justify-center min-w-[56px] h-12 transition-colors text-on-surface font-bold" data-path="explorar" href="#"><span class="material-symbols-outlined text-[24px]">explore</span><span class="font-label-sm text-label-sm mt-0.5">Explorar</span></a><a class="relative flex flex-col items-center justify-center min-w-[64px] h-12 px-space-sm rounded-full bg-primary-container text-on-primary-container hover:bg-primary-fixed-dim transition-all" data-path="pedalear" href="#"><span class="material-symbols-outlined text-[26px]">pedal_bike</span><span class="font-label-sm text-label-sm font-bold">Pedalear</span></a><a class="flex flex-col items-center justify-center min-w-[56px] h-12 text-secondary hover:text-on-surface transition-colors" data-path="actividad" href="#"><span class="material-symbols-outlined text-[24px]">bar_chart</span><span class="font-label-sm text-label-sm mt-0.5">Actividad</span></a><a class="flex flex-col items-center justify-center min-w-[56px] h-12 text-secondary hover:text-on-surface transition-colors" data-path="perfil" href="#"><span class="material-symbols-outlined text-[24px]">person</span><span class="font-label-sm text-label-sm mt-0.5">Perfil</span></a></div></nav></body></html>
